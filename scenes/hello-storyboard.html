    <rect x="160" y="120" width="200" height="120" rx="10"
          fill="#c7d2fe" stroke="#0f172a" stroke-width="2"></rect>

    <line x1="370" y1="180" x2="654" y2="180"

          font-family="Inter, sans-serif" font-size="13" fill="#64748b">

  <div style="position:absolute;left:64px;top:484px;width:896px;height:72px;background:#eef2ff;border-radius:12px;display:flex;align-items:center;justify-content:center;padding:0 24px;box-sizing:border-box">
